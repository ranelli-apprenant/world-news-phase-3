pre-commit:
  parallel: true
  commands:
    test_writer_back:
      root: "wn-rajar-ms_writer/writer-back"
      glob: "**/*.ts"
      run: npx tsc --noEmit

    test_writer_front:
      root: "wn-rajar-ms_writer/writer-front/"
      glob: "**/*.{ts,tsx,jsx}"
      run: |
        for file in {staged_files}; do
          npx tsc --jsx react-jsx --strict --noEmit "$file"
        done
    
    test_reader_front:
      root: "wn-rajar-ms_reader/reader-front"
      glob: "**/*.{js,jsx}"
      run: npx eslint {staged_files}

    test_reader_back:
      root: "wn-rajar-ms_reader/reader-back"
      glob: "**/*.js"
      run: |
        for file in {staged_files}; do
          node --check "$file"
        done

