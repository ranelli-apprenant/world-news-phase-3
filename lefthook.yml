pre-commit:
  parallel: true
  commands:
    test_writer_back:
      root: "wn-rajar-ms_writer/writer-back"
      glob: "**/*.ts"
      run: npx tsc --noEmit

    test_writer_front:
      root: "wn-rajar-ms_writer/writer-front/"
      glob: "**/*.{ts,tsx,jsx}"
      run: |
        for file in {staged_files}; do
          npx tsc --jsx react-jsx --strict --noEmit "$file"
        done

